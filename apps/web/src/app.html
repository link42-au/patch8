<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e11d48" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("%sveltekit.assets%/fonts/Geist-wght-v1.7.1.woff2") format("woff2");
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("%sveltekit.assets%/fonts/GeistMono-wght-v1.7.1.woff2") format("woff2");
        font-style: normal;
        font-weight: 300 500;
        font-display: swap;
      }
    </style>
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("patch8-theme");
        } catch {
          // The system preference remains a safe fallback when storage is unavailable.
        }
        const selected = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", selected);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
